<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoho Connect · PoC Builder</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236B1F3A'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='15' font-weight='800' font-family='system-ui'>ZC</text></svg>" />
</head>
<body>
  <!-- Particle canvas background -->
  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark">
          <span>ZC</span>
        </div>
        <div class="brand-text">
          <div class="brand-name">PoC Builder</div>
          <div class="brand-sub">Zoho Connect · Presales</div>
        </div>
      </div>
      <div class="topbar-center" id="topbar-progress" style="display:none">
        <!-- step progress injected here during flow -->
      </div>
      <div class="topbar-right">
        <div class="dc-badge" id="topbar-dc">
          <span class="dc-dot"></span>
          <span id="dc-label">India DC</span>
        </div>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="sidebar-inner">
          <div class="nav-group">
            <div class="nav-label">Workspace</div>
            <button class="nav-item active" data-view="new" onclick="App.showView('new',this)">
              <span class="nav-icon nav-icon-new">+</span>
              <span>New PoC</span>
            </button>
            <button class="nav-item" data-view="history" onclick="App.showView('history',this)">
              <span class="nav-icon">◷</span>
              <span>History</span>
              <span class="nav-badge" id="history-badge">0</span>
            </button>
          </div>
          <div class="nav-group">
            <div class="nav-label">Config</div>
            <button class="nav-item" data-view="settings" onclick="App.showView('settings',this)">
              <span class="nav-icon">⚙</span>
              <span>Settings</span>
            </button>
          </div>
        </div>
        <div class="sidebar-footer">
          <div class="sidebar-version">v2.0 · Presales Edition</div>
        </div>
      </nav>

      <!-- Main content -->
      <main class="content" id="content-area"></main>
    </div>
  </div>

  <!-- PDF lib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/generate.js"></script>
  <script src="js/deploy.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
